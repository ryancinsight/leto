# Test-time budget: a test crossing 30s is flagged slow (a performance defect in
# the code under test — profile and optimize the implementation, never raise
# this limit); a second 30s period terminates it as a hang/deadlock to
# root-cause. `cargo nextest run` is the only sanctioned test runner precisely
# because it applies this instrument.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }

# Miri interprets rather than executes, costing two to three orders of magnitude
# more per test, so the default bound would fire on interpreter overhead rather
# than on a defect in the code under test. This profile is used only by the Miri
# job and never relaxes the native budget above, which remains the authority on
# real execution time. A test that exceeds even this bound is a genuine hang to
# root-cause — under Miri that most likely means a deadlock the scheduler
# exposes — not a reason to raise the number again.
[profile.miri]
slow-timeout = { period = "300s", terminate-after = 2 }

# `lu_reconstructs_past_the_llc` exercises the blocked-LU path at the host's
# LLC spill boundary (n = sqrt(l3/8) + 1, capped at 2600): its purpose is
# correctness at the scale the gate engages, so the workload is analytically
# irreducible — a smaller fixed n stays cache-resident on large-L3 hosts and
# defeats the test. Total work is ~47 GFLOP (factor 2n³/3 + two n³
# reconstruction matmuls at n = 2600); the reference host measures the whole
# test at ~2 s (40+ GFLOP/s), while a hosted CI runner runs 10-30x slower on
# the memory-bound blocked path. The 150 s period (terminate at 300 s) is
# that measured ceiling with the same 2x headroom every other budget here
# carries; a CI run exceeding it still fails visibly rather than hanging the
# suite.
[[profile.default.overrides]]
filter = 'test(=lu_reconstructs_past_the_llc)'
slow-timeout = { period = "150s", terminate-after = 2 }
