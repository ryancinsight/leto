suite_seconds = 300
metadata_seconds = 3
termination_grace_seconds = 5

# The nominal duration is the number of Criterion cases multiplied by each
# case's configured warm-up plus measurement duration. The remainder is a
# finite allowance for Cargo startup, a warm-cache build, fixture construction,
# Criterion analysis, and process shutdown. A cold build that exceeds the
# allowance is an oversized run and fails rather than extending the budget.
[targets.kernels]
case_count = 108
sample_size = 10
warm_up_seconds = 0.5
measurement_seconds = 0.5
# Six operator-chain cases raise measurement time from 0.5s to 1s.
additional_criterion_seconds = 3
criterion_seconds = 111
overhead_seconds = 14
ceiling_seconds = 125

