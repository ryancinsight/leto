[workspace]
resolver = "2"
members = [
    "crates/leto",
    "crates/leto-ops",
    "crates/leto-python",
]

[workspace.package]
version = "0.38.0"
edition = "2021"
rust-version = "1.95"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/leto.git"

[workspace.dependencies]
# ── Local Workspace Crates ──
leto = { path = "crates/leto" }
leto-ops = { path = "crates/leto-ops" }

# ── Systems and Parallelization ──
mnemosyne = { git = "https://github.com/ryancinsight/Mnemosyne.git" }
moirai = { git = "https://github.com/ryancinsight/Moirai.git", default-features = false, features = ["async", "iter", "parallel", "local", "melinoe"] }
hermes-simd = { git = "https://github.com/ryancinsight/hermes.git" }
eunomia = { path = "../eunomia/crates/eunomia", default-features = false }
themis = { git = "https://github.com/ryancinsight/themis", default-features = false }

# ── Numeric Foundations ──
num-complex = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }
half = { version = "2.7", features = ["num-traits", "bytemuck"] }

# ── Optional Compatibility ──
ndarray = "0.16"
nalgebra = { version = "0.35", default-features = false, features = ["std"] }

# ── Error and Utility ──
thiserror = "2"
anyhow = "1.0"
serde_json = "1"

# ── Python FFI ──
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"

# ── Testing / Benchmarking ──
proptest = "1.11"
criterion = "0.8"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
