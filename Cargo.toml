[workspace]
resolver = "2"
members = [
    "crates/leto",
    "crates/leto-ops",
    "crates/leto-python",
]

[workspace.package]
version = "0.41.0"
edition = "2021"
rust-version = "1.95"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/leto.git"

[workspace.dependencies]
# ── Local Workspace Crates ──
leto = { version = "0.41.0", path = "crates/leto" }
leto-ops = { version = "0.41.0", path = "crates/leto-ops" }

# ── Systems and Parallelization (local path for migration) ──
mnemosyne = { path = "../mnemosyne/crates/mnemosyne", package = "mnemosyne-memory", features = ["eunomia"] }
moirai = { path = "../moirai/moirai", package = "moirai-runtime", default-features = false, features = ["async", "iter", "parallel", "local", "melinoe"] }
hermes-simd = { path = "../hermes/crates/hermes-simd" }
eunomia = { path = "../eunomia/crates/eunomia", package = "eunomia", default-features = false }
aequitas = { path = "../aequitas", package = "aequitas", default-features = false }
themis = { path = "../themis", package = "themis-topology", default-features = false }

# ── Numeric Foundations ──
bytemuck = { version = "1.25", features = ["derive"] }

# ── Dev-only compatibility deps were removed per LETO-NDARRAY-BOUNDARY-1 ──

# ── Serialization ──
serde = { version = "1.0", features = ["derive"] }

# ── Error and Utility ──
thiserror = "2"
anyhow = "1.0"
serde_json = "1"

# ── Python FFI ──
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"

# ── Testing / Benchmarking ──
proptest = "1.11"
criterion = "0.8"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
