[workspace]
resolver = "2"
members = [
    "crates/leto",
    "crates/leto-ops",
    "crates/leto-python",
]

[workspace.package]
version = "0.24.0"
edition = "2021"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/leto.git"

[workspace.dependencies]
# ── Local Workspace Crates ──
leto = { path = "crates/leto" }
leto-ops = { path = "crates/leto-ops" }

# ── Systems and Parallelization ──
mnemosyne = { git = "https://github.com/ryancinsight/Mnemosyne.git", rev = "1e014d25461b322345c15fb3cf9467b5388616dd" }
moirai = { git = "https://github.com/ryancinsight/Moirai.git", rev = "03d9d0346f52b08946875ff54540431e178aa51d" }
hermes-simd = { git = "https://github.com/ryancinsight/hermes.git", rev = "d4a01bde1c8cfa9dbd09015b712573bb0046b991", package = "hermes-simd" }
themis = { git = "https://github.com/ryancinsight/themis", default-features = false }

# ── Numeric Foundations ──
num-traits = "0.2"
num-complex = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }
half = { version = "2.7", features = ["num-traits", "bytemuck"] }

# ── Optional Compatibility ──
ndarray = "0.16"
nalgebra = { version = "0.35", default-features = false, features = ["std"] }

# ── Error and Utility ──
thiserror = "2"
anyhow = "1.0"

# ── Python FFI ──
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"

# ── Testing / Benchmarking ──
proptest = "1.11"
criterion = "0.8"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

# LOCAL-DEV ONLY (uncommitted): restores standalone buildability after the
# themis default-branch drifted to 0.9.x while leto's pinned hermes/mnemosyne
# require themis ^0.8.0 (so pure-git `cargo generate-lockfile` no longer
# resolves; Cargo.lock is gitignored). Mirrors the path-patch set apollo/coeus/
# hermes already use for the local stack. NOTE: this builds leto against the
# themis-0.9 hermes (`e6761ac`), which regresses dense matmul 43–61% at 64²/128²
# vs the `efac0454` baseline — do NOT commit / adopt in CI until hermes restores
# the dispatch/AXPY perf on its themis-0.9 line. See gap_audit.md §D.
[patch."https://github.com/ryancinsight/Mnemosyne.git"]
mnemosyne = { path = "../mnemosyne/crates/mnemosyne" }
mnemosyne-core = { path = "../mnemosyne/crates/mnemosyne-core" }
mnemosyne-arena = { path = "../mnemosyne/crates/mnemosyne-arena" }
mnemosyne-local = { path = "../mnemosyne/crates/mnemosyne-local" }
mnemosyne-heap = { path = "../mnemosyne/crates/mnemosyne-heap" }

[patch."https://github.com/ryancinsight/Moirai.git"]
moirai = { path = "../moirai/moirai" }
moirai-core = { path = "../moirai/moirai-core" }
moirai-scheduler = { path = "../moirai/moirai-scheduler" }
moirai-parallel = { path = "../moirai/moirai-parallel" }

[patch."https://github.com/ryancinsight/hermes.git"]
hermes-simd = { path = "../hermes/crates/hermes-simd" }

[patch."https://github.com/ryancinsight/melinoe.git"]
melinoe = { path = "../melinoe" }
