[workspace]
resolver = "2"
members = [
    "crates/leto",
    "crates/leto-ops",
    "crates/leto-python",
]

[workspace.package]
version = "0.42.0"
edition = "2021"
rust-version = "1.95"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/leto.git"

[workspace.dependencies]
# ── Local Workspace Crates ──
leto = { version = "0.42.0", path = "crates/leto" }
leto-ops = { version = "0.42.0", path = "crates/leto-ops" }

# ── Systems and Parallelization ──
mnemosyne = { package = "mnemosyne-memory", version = "0.7.0", git = "https://github.com/ryancinsight/Mnemosyne", features = ["eunomia"] }
moirai = { package = "moirai-runtime", version = "0.5.0", git = "https://github.com/ryancinsight/Moirai.git", default-features = false, features = ["async", "iter", "parallel", "local", "melinoe"] }
hermes-simd = { version = "0.6.0", git = "https://github.com/ryancinsight/hermes.git" }
eunomia = { package = "eunomia", version = "0.8.0", git = "https://github.com/ryancinsight/eunomia", default-features = false }
aequitas = { package = "aequitas", version = "0.2.0", git = "https://github.com/ryancinsight/aequitas", default-features = false }
themis = { package = "themis-topology", version = "0.10.1", git = "https://github.com/ryancinsight/themis", default-features = false }

# ── Numeric Foundations ──
bytemuck = { version = "1.25", features = ["derive"] }

# ── Dev-only compatibility deps were removed per LETO-NDARRAY-BOUNDARY-1 ──

# ── Serialization ──
serde = { version = "1.0", features = ["derive"] }

# ── Error and Utility ──
thiserror = "2"
anyhow = "1.0"
serde_json = "1"

# ── Python FFI ──
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"

# ── Testing / Benchmarking ──
proptest = "1.11"
criterion = "0.8"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
