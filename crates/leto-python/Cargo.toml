[package]
name = "leto-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "PyO3/NumPy bindings over the Leto array and kernel crates"
publish = false

[lib]
name = "leto_python"
crate-type = ["cdylib", "rlib"]
doc = false

[features]
default = ["parallel", "mnemosyne-memory"]
parallel = ["leto/parallel", "leto-ops/parallel"]
mnemosyne-memory = ["leto/mnemosyne-memory", "leto-ops/mnemosyne-memory"]

[dependencies]
# ── Local Workspace Crates ──
leto = { workspace = true }
leto-ops = { workspace = true }

# ── Python FFI ──
pyo3 = { workspace = true }
numpy = { workspace = true }

# ── Utility ──
anyhow = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
