[package]
name = "leto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "N-dimensional strided arrays, zero-copy views, and storage backends"
readme.workspace = true
documentation = "https://docs.rs/leto"
keywords = ["array", "multidimensional", "strided", "zero-copy", "views"]
categories = ["data-structures", "science", "mathematics"]

[dependencies]
# ── Systems and Parallelization ──
mnemosyne = { workspace = true, optional = true }

# ── Numeric Foundations ──
aequitas = { workspace = true }
eunomia = { workspace = true }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

# ── Error Handling ──
thiserror = { workspace = true }

[features]
default = ["std", "parallel", "mnemosyne-memory"]
std = ["aequitas/std", "serde/std"]
alloc = ["serde/alloc"]
parallel = []
# mnemosyne integration
mnemosyne-alloc = ["dep:mnemosyne", "alloc"]
mnemosyne-memory = ["mnemosyne-alloc"]
serde = ["dep:serde"]

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
