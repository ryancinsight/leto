[package]
name = "leto-ops"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# ── Local Workspace Crates ──
leto = { workspace = true }

# ── Systems and Parallelization ──
moirai = { workspace = true, optional = true }
hermes-simd = { workspace = true }
themis = { workspace = true, optional = true }

# ── Numeric Foundations ──
bytemuck = { workspace = true }
half = { workspace = true }

# ── Error Handling ──
thiserror = { workspace = true }

[dev-dependencies]
ndarray = { workspace = true }
nalgebra = { workspace = true }
num-complex = { workspace = true }
criterion = { workspace = true }
ndarray-rand = "0.15"
rand = "0.8"
rand_chacha = "0.3"

[[bench]]
name = "kernels"
harness = false

[features]
default = ["std", "parallel", "mnemosyne-memory", "topology"]
std = ["leto/std"]
parallel = ["dep:moirai"]
mnemosyne-memory = ["leto/mnemosyne-memory"]
ndarray-compat = ["leto/ndarray-compat"]
topology = ["std", "dep:themis", "themis/std"]
