[package]
name = "leto-ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# ── Local Workspace Crates ──
leto = { workspace = true }

# ── Systems and Parallelization ──
moirai = { workspace = true, optional = true }
hermes-simd = { workspace = true }
themis = { workspace = true, optional = true }

# ── Numeric Foundations ──
bytemuck = { workspace = true }
eunomia = { workspace = true }

# ── Serialization ──
serde = { workspace = true }

# ── Error Handling ──
thiserror = { workspace = true }

[dev-dependencies]
aequitas.workspace = true
leto = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "kernels"
harness = false

[features]
default = ["std", "parallel", "mnemosyne-memory", "topology"]
std = ["leto/std"]
parallel = ["dep:moirai"]
mnemosyne-memory = ["leto/mnemosyne-memory"]
topology = ["std", "dep:themis", "themis/std"]
