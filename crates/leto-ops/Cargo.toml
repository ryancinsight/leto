[package]
name = "leto-ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Math, reduction, SIMD, and parallel kernels for Leto arrays"
readme.workspace = true
documentation = "https://docs.rs/leto-ops"
keywords = ["linear-algebra", "simd", "matrix", "kernels", "sparse"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
# ── Local Workspace Crates ──
leto = { workspace = true }

# ── Systems and Parallelization ──
moirai = { workspace = true, optional = true }
hermes-simd = { workspace = true }
themis = { workspace = true, optional = true }

# ── Numeric Foundations ──
eunomia = { workspace = true }

# ── Serialization ──
serde = { workspace = true }

# ── Error Handling ──
thiserror = { workspace = true }

[dev-dependencies]
aequitas.workspace = true
leto = { workspace = true }
# Already a normal dependency; repeated here so integration tests can name the
# scalar traits (`RealField::EPSILON`, `FloatElement::from_f64`) that
# precision-generic test batteries need to derive their own error bounds.
eunomia = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "kernels"
harness = false

# ATLAS-ARCH-008 sub-slice: L-BFGS flat-ring vs jagged-baseline direction.
# Compares the converted CSR-shaped ring buffer (`LbfgsMemory`) against an
# inline pre-conversion `Vec<Vec<f64>>` reference over {8, 32} memory ×
# {100, 1000} dim. Run with `cargo bench -p leto-ops --bench lbfgs`;
# single-iteration smoke via `-- --test`.
[[bench]]
name = "lbfgs"
harness = false

[features]
default = ["std", "parallel", "mnemosyne-memory", "topology"]
std = ["leto/std"]
parallel = ["dep:moirai"]
mnemosyne-memory = ["leto/mnemosyne-memory"]
topology = ["std", "dep:themis", "themis/std"]

[lints]
workspace = true
