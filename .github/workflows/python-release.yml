name: Python Release

on:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    if: github.event_name == 'pull_request' || startsWith(github.event.release.tag_name, 'leto-python-v')
    name: Build and attach wheels
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    uses: ryancinsight/atlas/.github/workflows/python-wheels.yml@227ff172612b8aff553be22be89fabdf71838a03
    with:
      distribution: leto-python
      import-name: leto_python
      manifest-path: crates/leto-python/Cargo.toml
      atlas-ref: 227ff172612b8aff553be22be89fabdf71838a03
      tag-prefix: leto-python-v
      abi3: false
      python-versions: '["3.9", "3.10", "3.11", "3.12", "3.13"]'
      python-test-path: crates/leto-python/tests/test_wheel_contract.py
      pytest-version: "8.4.2"
      # Exercise the actual release matrix before integration. The shared
      # verification mode validates/attests artifacts without a release tag,
      # GitHub Release attachment or PyPI publication.
      verification: ${{ github.event_name != 'release' }}

  publish:
    if: startsWith(github.event.release.tag_name, 'leto-python-v')
    name: Publish wheels to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/leto-python
    permissions:
      id-token: write
    steps:
      - name: Download validated release wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-wheels
          path: dist

      - name: Publish wheels through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist/
          print-hash: true
