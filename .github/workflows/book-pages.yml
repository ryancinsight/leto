name: Deploy mdBook

on:
  push:
    branches: [main]
    paths:
      - "docs/book/**"
      - ".github/workflows/book-pages.yml"
  pull_request:
    paths:
      - "docs/book/**"
      - ".github/workflows/book-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-pages-${{ github.ref }}
  # Deploys queue behind one another; a half-cancelled deploy is worse than a
  # superseded one, and a cancelled default-branch run leaves that merge undeployed.
  cancel-in-progress: false

jobs:
  deploy:
    uses: ryancinsight/atlas/.github/workflows/book-pages.yml@1fcd17c6f7923cb1734756c15e0a5a39e333ee32
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      output-path: target/book/leto
      mdbook-test: true
      rust-toolchain: "1.97.0"
      cargo-package: leto
