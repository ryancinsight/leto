name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull requests share one group per ref and cancel superseded runs; default-
  # branch runs get one group per commit, since GitHub supersedes a pending run
  # in a shared group whatever `cancel-in-progress` says.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.0

jobs:
  # Public-surface compatibility, informational on pull requests: the
  # detected change class is visible while the change is still in
  # review. The blocking comparison runs on release.
  # Atlas ATLAS-SEMVER-GATE-FLEETWIDE-2026-08-28.
  semver:
    name: SemVer gate
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@da9d549bc50dbb9c4e1d18dca8f37d17059098cb
    with:
      package: leto-ops,leto
      rust-toolchain: 1.97.0
    permissions:
      contents: read

  adr-index:
    name: ADR index is current
    # atlas owns the one generator (ATLAS-ADR-FORM-NORMALIZATION-2026-09-02); strict: the ADRs carry the canonical heading form and numbering.
    uses: ryancinsight/atlas/.github/workflows/adr-index-guard.yml@191617bffed5f78de9d840fee8755963fccaaa67
    permissions:
      contents: read
    with:
      strict: true

  # Guards the one artifact whose correctness cannot be checked from inside the
  # overlay environment that produces it. Calls the shared Atlas workflow.
  lockfile:
    name: Lockfile integrity
    uses: ryancinsight/atlas/.github/workflows/lockfile-guard.yml@886d85b0e4bea20c8e5ec4b4239e6ba9cdbcf74d
    permissions:
      contents: read

  verify:
    name: Rust verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check minimal features
        run: cargo check --locked -p leto -p leto-ops --no-default-features

      - name: Lint all affected targets
        run: cargo clippy --locked -p leto -p leto-ops --all-targets -- -D warnings

      - name: Run native tests
        run: cargo nextest run --locked -p leto -p leto-ops

      - name: Run documentation tests
        run: cargo test --locked -p leto -p leto-ops --doc

      - name: Build documentation
        run: cargo doc --locked -p leto -p leto-ops --no-deps

  # Miri over the code whose correctness rests on an invariant the native suite
  # cannot see.
  #
  # `reduce_axis` writes its output through `VecStorage::uninit` and raw
  # pointers (PR #157, `d16e3b2`): the single-write optimization is sound only
  # because every output element is written before it is read, and that
  # obligation lives in prose on `VecStorage::uninit`, not in the type system.
  # Nothing gated it, which is the defect generator the mnemosyne board already
  # recorded for a crate sitting outside its Miri gate (MN-459): the sweep that
  # fixed every gated sibling could not see the ungated copy.
  #
  # Both borrow models run, and that is not belt-and-braces: an MN-437 fix in
  # this stack passed Stacked Borrows while Tree Borrows still rejected it, so a
  # single-model gate would have certified a still-broken fix.
  miri:
    name: Miri (uninitialized memory and aliasing)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Miri nightly toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly
          components: miri

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140

      # Isolation is disabled because the allocator reads the clock and the OS
      # page size; leak checking stays on, as in mnemosyne's Miri job.
      #
      # `layout_property_tests` is excluded. It is a proptest suite that samples
      # thousands of layouts per run, sized for native execution; under Miri
      # every sample is interpreted, so its cost is workload, not a hang. The
      # exclusion is a scope decision, not a suppression: the property is still
      # checked natively by `verify`, and what Miri is here for — the
      # uninitialized-write and aliasing contracts in the reduction, storage,
      # and allocation paths — is covered by the binaries selected below.
      - name: Miri — leto (Stacked Borrows)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: >-
          cargo +nightly miri nextest run -p leto --locked --profile miri
          --lib --test core_tests --test operator_allocations

      - name: Miri — leto-ops (Stacked Borrows)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: >-
          cargo +nightly miri nextest run -p leto-ops --locked --profile miri
          --lib --test ops_tests --test complex_transpose_allocations
          --test migration_fixtures

      - name: Miri — leto (Tree Borrows)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-tree-borrows
        run: >-
          cargo +nightly miri nextest run -p leto --locked --profile miri
          --lib --test core_tests --test operator_allocations

      - name: Miri — leto-ops (Tree Borrows)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-tree-borrows
        run: >-
          cargo +nightly miri nextest run -p leto-ops --locked --profile miri
          --lib --test ops_tests --test complex_transpose_allocations
          --test migration_fixtures
