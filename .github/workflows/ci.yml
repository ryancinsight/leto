name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull requests share one group per ref and cancel superseded runs; default-
  # branch runs get one group per commit, since GitHub supersedes a pending run
  # in a shared group whatever `cancel-in-progress` says.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ATLAS_PIN: b94ee304b83fbdc1a1542af66ba4668ebda2ae15
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.0

jobs:
  # Compare the committed locked source contract, failing on build errors.
  # The informational generator updates moving Git providers and can report
  # success after failing to resolve this workspace's reviewed Moirai version.
  # Reuse Atlas PR #540's existing implementation at an exact source revision.
  semver:
    name: SemVer gate
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@a55f3e2d3c9c2a7626baca05dbccc49642e521aa
    with:
      package: leto-ops,leto
      rust-toolchain: 1.97.0
      dependency-contract: locked
      atlas-ref: a55f3e2d3c9c2a7626baca05dbccc49642e521aa
    permissions:
      contents: read

  adr-index:
    name: ADR index is current
    # atlas owns the one generator (ATLAS-ADR-FORM-NORMALIZATION-2026-09-02); strict: the ADRs carry the canonical heading form and numbering.
    uses: ryancinsight/atlas/.github/workflows/adr-index-guard.yml@191617bffed5f78de9d840fee8755963fccaaa67
    permissions:
      contents: read
    with:
      strict: true

  # Guards the one artifact whose correctness cannot be checked from inside the
  # overlay environment that produces it. Calls the shared Atlas workflow.
  lockfile:
    name: Lockfile integrity
    uses: ryancinsight/atlas/.github/workflows/lockfile-guard.yml@886d85b0e4bea20c8e5ec4b4239e6ba9cdbcf74d
    permissions:
      contents: read

  verify:
    name: Rust verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Materialize the pinned Atlas tooling checkout
        # ADR 0067: the bench runner consumes Atlas's process-tree runner from
        # an exact sparse checkout of the pinned commit, never a moving branch.
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ryancinsight/atlas.git "$RUNNER_TEMP/atlas"
          git -C "$RUNNER_TEMP/atlas" checkout "$ATLAS_PIN"

      - name: Test bounded benchmark runner
        working-directory: scripts
        env:
          ATLAS_TOOLING_CHECKOUT: ${{ runner.temp }}/atlas
        run: python -m unittest discover -s tests/bench -t tests -p 'test_*.py'

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check minimal features
        run: cargo check --locked -p leto -p leto-ops --no-default-features

      - name: Lint all affected targets
        run: cargo clippy --locked -p leto -p leto-ops --all-targets -- -D warnings

      - name: Run native tests
        run: cargo nextest run --locked -p leto -p leto-ops

      - name: Run documentation tests
        run: cargo test --locked -p leto -p leto-ops --doc

      - name: Build documentation
        run: cargo doc --locked -p leto -p leto-ops --no-deps

  # Miri over the code whose correctness rests on an invariant the native suite
  # cannot see.
  #
  # Owned numerical outputs remain MaybeUninit slots until their shared kernel
  # succeeds. Padding supports Clone payloads and tracks its live prefix through
  # vector ownership. Storage tests cover valid conversion, abandoned slots,
  # alignment and panic cleanup; operation tests cover every numeric caller.
  #
  # Both borrow models run, and that is not belt-and-braces: an MN-437 fix in
  # this stack passed Stacked Borrows while Tree Borrows still rejected it, so a
  # single-model gate would have certified a still-broken fix.
  #
  # Complete leto --lib and affected reduction/embedding/triangular/volume
  # ops tests run under both models. Broader ops/property Miri suites remain
  # outside this gate; their limitations stay on LETO-MIRI-GATE-2026-09-10.
  # The original 600-second per-test and 45-minute job bounds are unchanged.
  miri:
    name: Miri (uninitialized memory and aliasing)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Miri nightly toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly
          components: miri

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140

      # Isolation is disabled because the allocator reads the clock and the OS
      # page size; leak checking stays on, as in mnemosyne's Miri job.
      - name: Miri — storage substrate (Stacked Borrows)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri nextest run -p leto --locked --profile miri --lib

      # The parallel axis reduction engages only above 32768 outputs, so its
      # test reduces a 40000x8 array; under Miri that exceeds the profile's
      # 600 s bound. Miri therefore covers the serial output path only, and
      # the parallel task split is covered by the native suite.
      - name: Miri — initialized numeric output contracts (Stacked Borrows)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: >-
          cargo +nightly miri nextest run -p leto-ops --locked --profile miri
          --test ops_tests
          -E '(test(/reduction/) | test(/embedding/) | test(/triangular/) | test(/volume/)) & !test(parallel_axis_reduction_matches_the_serial_result)'

      - name: Miri — storage substrate (Tree Borrows)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-tree-borrows
        run: cargo +nightly miri nextest run -p leto --locked --profile miri --lib

      - name: Miri — initialized numeric output contracts (Tree Borrows)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-tree-borrows
        run: >-
          cargo +nightly miri nextest run -p leto-ops --locked --profile miri
          --test ops_tests
          -E '(test(/reduction/) | test(/embedding/) | test(/triangular/) | test(/volume/)) & !test(parallel_axis_reduction_matches_the_serial_result)'
